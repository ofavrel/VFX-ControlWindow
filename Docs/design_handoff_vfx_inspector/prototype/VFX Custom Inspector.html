<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visual Effect — Custom Inspector Explorations</title>
<link rel="stylesheet" href="assets/colors_and_type.css" />
<link rel="stylesheet" href="vfx.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  #root { height: 100vh; }
  /* artboard wrapper that hosts a full-height docked inspector window */
  .vfx-window {
    height: 100%;
    border: 1px solid var(--uc-window-border);
    background: var(--uc-window-bg);
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(0,0,0,0.18);
  }
  /* tab strip that sits atop a Unity window (visual chrome only) */
  .vfx-wintab {
    display: flex; align-items: flex-end; gap: 2px;
    height: 24px; padding: 4px 4px 0;
    background: var(--uc-app_toolbar-bg);
  }
  .vfx-wintab .t {
    display: flex; align-items: center; gap: 6px;
    height: 20px; padding: 0 11px; font-size: 11px;
    color: var(--uc-default-text);
    background: var(--uc-window-bg);
    border: 1px solid var(--uc-window-border); border-bottom: none;
    border-radius: 5px 5px 0 0;
  }
  .vfx-wintab .t .ti { color: #c98a3a; display: flex; }
  .vfx-window .vfx-inspector { height: calc(100% - 24px); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="vfx-data.jsx"></script>
<script type="text/babel" src="vfx-atoms.jsx"></script>
<script type="text/babel" src="inspector-shared.jsx"></script>
<script type="text/babel" src="inspector-native.jsx"></script>
<script type="text/babel" src="inspector-tabbed.jsx"></script>
<script type="text/babel" src="inspector-bold.jsx"></script>

<script type="text/babel">
const { useState } = React;
const { DesignCanvas, DCSection, DCArtboard } = window;
const { useTweaks, TweaksPanel, TweakSection, TweakRadio } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "compact",
  "propStyle": "table"
}/*EDITMODE-END*/;

// a Unity window tab cap over each inspector, for context
function WinTab() {
  return (
    <div className="vfx-wintab">
      <div className="t"><span className="ti"><VIcon name="gear" size={12} /></span>Inspector</div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const cfg = { propStyle: t.propStyle, density: t.density };

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="vfx" title="Visual Effect — custom inspector" subtitle="Three directions, native → bold · same VFX_Fireball asset · search · favorites · per-property reset · live playback">
          <DCArtboard id="native" label="A · Native+   ·   foldouts + search + favorites" width={356} height={760}>
            <div className="vfx-window"><WinTab /><InspectorNative {...cfg} /></div>
          </DCArtboard>
          <DCArtboard id="tabbed" label="B · Tabbed   ·   Properties / Playback / Debug" width={356} height={760}>
            <div className="vfx-window"><WinTab /><InspectorTabbed {...cfg} /></div>
          </DCArtboard>
          <DCArtboard id="bold" label="C · Bold   ·   rail + filters + pinned tray + sticky transport" width={372} height={760}>
            <div className="vfx-window"><WinTab /><InspectorBold {...cfg} /></div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Density" />
        <TweakRadio label="Spacing" value={t.density} options={['compact', 'comfortable']} onChange={(v) => setTweak('density', v)} />
        <TweakSection label="Property layout" />
        <TweakRadio label="Style" value={t.propStyle} options={['rows', 'cards', 'table']} onChange={(v) => setTweak('propStyle', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
